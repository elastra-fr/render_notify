name: CI — Tests & Coverage

on:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  precheck:
    name: Detect changes & optional version check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: detect
        uses: actions/github-script@v6
        with:
          script: |
            const pr = context.payload.pull_request;
            if (!pr) {
              core.setOutput('changed','true');
              return;
            }
            const files = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: pr.number
            });
            const interesting = ['render_notify/_version.py','render_notify/__init__.py'];
            const changed = files.data.some(f => interesting.includes(f.filename));
            core.setOutput('changed', changed ? 'true' : 'false');

      - name: Set up Python (for version check)
        if: steps.detect.outputs.changed == 'true'
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install deps (for version check)
        if: steps.detect.outputs.changed == 'true'
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Run version check
        if: steps.detect.outputs.changed == 'true'
        run: |
          python - <<'PY'
          import sys, types
          bpy = types.ModuleType("bpy")
          app_mod = types.ModuleType("bpy.app")
          handlers_mod = types.ModuleType("bpy.app.handlers")
          def persistent(fn):
              return fn
          handlers_mod.persistent = persistent
          handlers_mod.render_init = []
          handlers_mod.render_complete = []
          handlers_mod.render_cancel = []
          app_mod.handlers = handlers_mod
          bpy.app = app_mod
          bpy.utils = types.SimpleNamespace(unregister_class=lambda cls: None, register_class=lambda cls: None)
          bpy.types = types.SimpleNamespace(AddonPreferences=object, Operator=object)
          bpy.context = types.SimpleNamespace(preferences=types.SimpleNamespace(addons={}))
          sys.modules['bpy'] = bpy
          sys.modules['bpy.app'] = app_mod
          sys.modules['bpy.app.handlers'] = handlers_mod
          import render_notify
          from render_notify import _version
          version_str = _version.__version__
          bl_info = getattr(render_notify, 'bl_info', {})
          bl_ver = bl_info.get('version')
          if isinstance(bl_ver, (list, tuple)):
              bl_ver_str = ".".join(str(x) for x in bl_ver)
          else:
              bl_ver_str = str(bl_ver)
          if version_str != bl_ver_str:
              print(f"Version mismatch: _version={version_str} bl_info={bl_ver_str}")
              raise SystemExit(1)
          print("Version OK")
          PY

  test:
    name: Run tests and publish coverage
    needs: precheck
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.12]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements-dev.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Run tests
        run: |
          pytest -vv --maxfail=1 --disable-warnings

      - name: Upload coverage HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-html
          path: htmlcov
          if-no-files-found: ignore

      - name: Upload coverage XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
          if-no-files-found: ignore
