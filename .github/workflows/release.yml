name: Release — Tag & GitHub Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.12]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi

      - name: Run tests
        run: |
          pytest -vv --maxfail=1 --disable-warnings

  release:
    name: Create tag and GitHub Release
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git for pushing tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Debug — Afficher l'arborescence du workspace
        run: |
          echo "Contenu du workspace :"
          ls -l $GITHUB_WORKSPACE
          echo "Arborescence complète :"
          find $GITHUB_WORKSPACE
      - name: Read package version
        id: version
        run: |
          export PYTHONPATH="$GITHUB_WORKSPACE"
          VERSION=$(python -c "from render_notify._version import __version__; print(__version__)" )
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Create and push tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          NEW_TAG="v${{ steps.version.outputs.VERSION }}"
          git fetch --tags
          if git ls-remote --tags origin | grep -q "refs/tags/$NEW_TAG"; then
            echo "Tag $NEW_TAG already exists on origin, skipping creation."
            exit 0
          fi
          git tag -a "$NEW_TAG" -m "Release $NEW_TAG"
          git push origin "$NEW_TAG"

      - name: Create dist directory
        run: mkdir -p dist

      - name: Create Blender addon zip
        run: |
          zip -r dist/render_notify-${{ steps.version.outputs.VERSION }}.zip render_notify -x 'render_notify/tests/*' '*.pyc' '*/__pycache__/*'

      - name: Publish GitHub Release with clean addon zip
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION }}
          name: v${{ steps.version.outputs.VERSION }}
          files: dist/render_notify-${{ steps.version.outputs.VERSION }}.zip
          body: |
            ## Installation
            Téléchargez **render_notify-${{ steps.version.outputs.VERSION }}.zip** ci-dessous (ne pas utiliser “Source code”).
            
            Dans Blender :
            Edit > Preferences > Add-ons > Install...
            Sélectionnez le fichier render_notify-${{ steps.version.outputs.VERSION }}.zip.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
